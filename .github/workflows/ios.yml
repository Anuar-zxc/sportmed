name: iOS

on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Сборка и тесты (симулятор iPhone)
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
          ls -la

      - name: Симулятор
        id: sim
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone 15")]; print(c[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Сборка и юнит-тесты
        run: |
          set -o pipefail
          xcodebuild test \
            -project AISports.xcodeproj -scheme AISports \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            | tee xcodebuild.log | grep -E "error:|warning: .*(unused|deprecated)|Test Case|Executed|BUILD|TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Лог при ошибке
        if: failure()
        run: grep -E "error:|error " xcodebuild.log | head -80 || tail -80 xcodebuild.log

      - name: Артефакты
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-build-log
          path: |
            ios/xcodebuild.log
            ios/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
