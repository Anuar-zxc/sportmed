name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Синтаксис JS и JSON
        run: |
          for f in *.js vendor/*.js; do node --check "$f"; done
          python -c "import json,glob; [json.load(open(f, encoding='utf-8')) for f in ['vercel.json', *glob.glob('*.webmanifest'), *glob.glob('ml/models/*.json')]]; print('json ok')"

      - name: Зависимости
        run: |
          pip install -r ml/requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: Модели — паритет браузера и Python
        run: python ml/verify_js.py

      - name: Сквозные тесты в браузере (CSP как в продакшене)
        run: python tests/e2e.py
