# Проект генерируется XcodeGen: `brew install xcodegen && xcodegen generate` (см. ios/README.md)
name: AISports
options:
  bundleIdPrefix: kz.aisports
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""           # ваш Team ID из Xcode → Signing; для запуска на своём iPhone хватает бесплатного Personal Team
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  AISports:
    type: application
    platform: iOS
    sources:
      - path: AISports
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.aisports.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: AISports/AISports.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    info:
      path: AISports/Info.plist
      properties:
        CFBundleDisplayName: AI Sports
        CFBundleName: AI Sports
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: "Bluetooth нужен, чтобы читать пульс, HRV и заряд с вашего браслета AI Sports. Данные остаются на телефоне."
        NSCameraUsageDescription: "Камера нужна только для сканирования QR-кода с персональной ссылкой на чек-ин."
        NSHealthShareUsageDescription: "Если вы носите Apple Watch, приложение покажет ночные HRV, пульс покоя, SpO₂, сон и температуру. Данные никуда не отправляются."
        NSHealthUpdateUsageDescription: "Приложение не записывает данные в Здоровье."
        UIBackgroundModes: [bluetooth-central]
        WKAppBoundDomains: [sportmed-eight.vercel.app]
        CFBundleURLTypes:
          - CFBundleURLName: kz.aisports.app
            CFBundleURLSchemes: [aisports]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
  AISportsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AISportsTests
    dependencies:
      - target: AISports
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.aisports.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AISports:
    build:
      targets:
        AISports: all
        AISportsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [AISportsTests]
      gatherCoverageData: true
